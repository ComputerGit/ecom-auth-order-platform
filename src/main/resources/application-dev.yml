# application-dev.yml
spring:
  application:
    name: eCommerce

  datasource:
    url: jdbc:postgresql://localhost:5432/eCommerce
    username: postgres
    password: Rahul@123

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: JSongsThatare
  access-token-expiration: 600000          # 10 minutes
  refresh-token-expiration: 1209600000     # 14 days

discount:
  types: PERCENTAGE,FLAT_RATE,BUY_ONE_GET_ONE,FREE_SHIPPING

change:
  types: ADD,REMOVE,ADJUST

read:
  status: READ,UNREAD

notification:
  types: ORDER_UPDATE,PROMOTION,REMINDER,SYSTEM_ALERT

SECRET_KEY: jUSTINbIerberfsffdgegfe

aws:
  region: ap-southeast-2
  kms:
    key-id: mrk-b98d3b34b79440d2ba54f289f5a027e8

logging:
  level:
    root: INFO
    org.springframework: INFO
    com.at.t: DEBUG
  file:
    name: logs/spring-boot-app.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      show-details: always

info:
  app:
    name: E-Commerce App
    version: 1.0.0
    description: Spring Boot backend for eCommerce
